<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Page Not Found | Bridge Solver</title>
        <meta name="robots" content="noindex, follow" />
        <meta name="description" content="The requested page could not be found on Bridge Solver." />
        <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <style>
            :root {
                --notion-blue: #0075de;
                --text-primary: rgba(0, 0, 0, 0.95);
                --text-secondary: #615d59;
                --border-whisper: 1px solid rgba(0, 0, 0, 0.1);
                --card-shadow:
                    rgba(0, 0, 0, 0.04) 0px 4px 18px, rgba(0, 0, 0, 0.027) 0px 2.025px 7.84688px,
                    rgba(0, 0, 0, 0.02) 0px 0.8px 2.925px, rgba(0, 0, 0, 0.01) 0px 0.175px 1.04062px;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                font-family: Inter, -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
                background-color: #f8fafc;
                color: var(--text-primary);
                font-size: 16px;
                line-height: 1.6;
            }

            main {
                width: 100%;
                max-width: 560px;
                background: #ffffff;
                border: var(--border-whisper);
                border-radius: 12px;
                box-shadow: var(--card-shadow);
                padding: 40px 32px;
                text-align: center;
            }

            .code {
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 0.12em;
                color: #a39e98;
                margin: 0 0 8px;
            }

            h1 {
                font-size: 24px;
                font-weight: 700;
                margin: 0 0 12px;
            }

            p {
                color: var(--text-secondary);
                margin: 0 0 8px;
            }

            .ja {
                font-size: 14px;
            }

            nav {
                margin-top: 28px;
                padding-top: 24px;
                border-top: var(--border-whisper);
            }

            nav h2 {
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: #a39e98;
                margin: 0 0 14px;
            }

            ul {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
            }

            a {
                display: inline-block;
                padding: 8px 14px;
                border: var(--border-whisper);
                border-radius: 8px;
                color: var(--notion-blue);
                text-decoration: none;
                font-size: 14px;
                font-weight: 600;
            }

            a:hover {
                background: #f6f5f4;
            }

            .lang {
                margin-top: 18px;
                font-size: 13px;
                color: #a39e98;
            }

            .lang a {
                border: none;
                padding: 0 4px;
                font-weight: 600;
            }

            .lang a:hover {
                background: none;
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <main>
            <p class="code">404</p>
            <h1>Page Not Found</h1>
            <p>The page you requested does not exist or may have been moved.</p>
            <p class="ja" lang="ja">お探しのページは見つかりませんでした。URLが変更されたか、削除された可能性があります。</p>

            <nav>
                <h2>Bridge Solver Tools</h2>
                <ul>
                    <li><a href="/en/double-dummy">Double Dummy</a></li>
                    <li><a href="/en/single-dummy">Single Dummy</a></li>
                    <li><a href="/en/opening-lead">Opening Lead</a></li>
                    <li><a href="/en/probability-solver">Probability Solver</a></li>
                    <li><a href="/en/reference/probability">Reference</a></li>
                </ul>
                <p class="lang">
                    <a href="/en/double-dummy">English</a> ·
                    <a href="/ja/double-dummy" lang="ja">日本語</a>
                </p>
            </nav>
        </main>
    </body>
</html>
